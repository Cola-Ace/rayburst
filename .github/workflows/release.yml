name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows x64 installer
    runs-on: windows-2025-vs2026
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $cargo = Get-Content src-tauri/Cargo.toml -Raw
          $cargoVersion = [regex]::Match($cargo, '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($packageVersion -ne $cargoVersion) {
            throw "package.json and Cargo.toml versions must match."
          }
          if ($env:RELEASE_TAG -and $env:RELEASE_TAG -ne "v$cargoVersion") {
            throw "Release tag must match v$cargoVersion."
          }

      - run: pnpm install --frozen-lockfile

      - name: Build Windows x64 installer
        run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis -- --locked

      - name: Check Windows runtime linkage
        run: |
          $ErrorActionPreference = "Stop"
          $paths = @(
            "src-tauri/target/x86_64-pc-windows-msvc/release/rayburst.exe",
            "src-tauri/generated-binaries/rayburst-browser-launcher-x86_64-pc-windows-msvc.exe"
          )
          foreach ($path in $paths) {
            $binary = [System.Text.Encoding]::ASCII.GetString([System.IO.File]::ReadAllBytes((Join-Path $PWD $path)))
            if ($binary -match 'vcruntime140|msvcp140') {
              throw "$path links the Visual C++ runtime dynamically."
            }
          }

      - name: Upload release installer
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = "Stop"
          $installer = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*_x64-setup.exe)
          if ($installer.Count -ne 1) {
            throw "Expected exactly one Windows x64 installer."
          }
          $installerPath = $installer[0].FullName
          gh release upload $env:RELEASE_TAG $installerPath --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: rayburst-windows-x64
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*_x64-setup.exe
          if-no-files-found: error
          retention-days: 7
